[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-sound-detection"
version = "1.0.0"
authors = [
    { name = "Anomaly Detection Research Team" },
]
description = "Contrastive-Learning Patch-Attention Framework with Attribute-Conditioned Multi-Centroid Modeling for DCASE Anomaly Sound Detection"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "librosa>=0.10.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "Pillow>=9.5.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[project.scripts]
asd-cli = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
